    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ee;
        --ink: #26231f;
        --muted: #716b63;
        --line: #ddd4c5;
        --paper: #fffdf8;
        --green: #2f6f5e;
        --blue: #315f86;
        --gold: #b27728;
        --shadow: 0 14px 36px rgba(38, 35, 31, 0.1);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button { font: inherit; }

      .page {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        margin-bottom: 18px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.2;
        padding: 0 12px;
        text-decoration: none;
      }

      .book {
        display: grid;
        grid-template-columns: minmax(220px, 340px) minmax(0, 1fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .cover {
        position: relative;
        align-self: start;
        background: #e9e2d4;
      }

      .cover.is-broken {
        background: #eee7d8;
      }

      .cover img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      .cover-placeholder {
        width: 100%;
        min-height: 420px;
      }

      .cover-placeholder {
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--muted);
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        line-height: 1.1;
      }

      .body {
        padding: 28px;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .badge {
        display: inline-flex;
        border-radius: 999px;
        background: rgba(247, 244, 238, 0.94);
        color: var(--ink);
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.library { color: var(--green); }
      .badge.exchange { color: var(--blue); }

      h1 {
        margin: 14px 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 6vw, 52px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .author {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 18px;
      }

      .details {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 8px 16px;
        margin: 22px 0;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .details dt {
        color: var(--muted);
        font-size: 13px;
      }

      .details dd {
        margin: 0;
        font-size: 14px;
      }

      .annotation {
        margin: 0;
        color: #4d473f;
        font-size: 15px;
        line-height: 1.55;
      }

      .deposit-note {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 16px 0 0;
        padding: 14px 16px;
        border: 1px solid #e4c681;
        border-radius: 8px;
        background: linear-gradient(135deg, #fff8e8, #fffdf8);
        color: var(--ink);
        box-shadow: 0 6px 18px rgba(178, 119, 40, 0.1);
      }

      .deposit-note-icon {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        border-radius: 50%;
        background: var(--gold);
        color: #fff;
        font-size: 22px;
        font-weight: 800;
        line-height: 1;
      }

      .deposit-note strong,
      .deposit-note small { display: block; }

      .deposit-note strong {
        font-size: 15px;
        line-height: 1.35;
      }

      .deposit-note small {
        margin-top: 2px;
        color: #655438;
        font-size: 13px;
        line-height: 1.4;
      }

      .collection-note {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
        white-space: pre-line;
      }

      .location-note {
        display: block;
        margin: 12px 0 0;
        padding: 12px 14px;
        border-left: 4px solid var(--gold);
        border-radius: 4px;
        background: #fff8e8;
        color: var(--ink);
        font-size: 14px;
        font-weight: 650;
        line-height: 1.45;
        white-space: normal;
      }

      .location-note::before { content: "📍 "; }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .actions a,
      .actions button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--blue);
        min-height: 40px;
        padding: 8px 12px;
        text-decoration: none;
        cursor: pointer;
        font-weight: 700;
        line-height: 1.22;
      }

      .actions a:hover,
      .actions button:hover {
        border-color: var(--blue);
      }

      .telegram-icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        fill: currentColor;
      }

      .actions .telegram-action span {
        display: block;
        min-width: 0;
        text-align: center;
      }

      .actions .telegram-action {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
      }

      .related {
        margin-top: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.7);
        padding: 18px;
      }

      .related-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }

      .related-tabs {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        margin-left: auto;
        gap: 8px;
      }

      .related-tab {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        padding: 0 12px;
      }

      .related-tab[aria-selected="true"] {
        border-color: var(--green);
        background: rgba(47, 111, 94, 0.11);
        color: var(--green);
      }

      .related-tab:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .related-track {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 14px;
        padding: 2px;
      }

      .related-card {
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: inherit;
        text-decoration: none;
      }

      .related-card-link {
        display: flex;
        flex: 1;
        flex-direction: column;
        color: inherit;
        text-decoration: none;
      }

      .related-card:hover {
        border-color: rgba(49, 95, 134, 0.55);
      }

      .related-card-link:focus-visible {
        outline: 3px solid rgba(47, 111, 94, 0.35);
        outline-offset: -3px;
      }

      .related-cover {
        aspect-ratio: 4 / 5.7;
        background: #e9e2d4;
      }

      .related-cover.is-broken {
        background: #eee7d8;
      }

      .related-cover img,
      .related-cover .cover-placeholder {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: cover;
      }

      .related-cover .cover-placeholder {
        display: grid;
        place-items: center;
        padding: 14px;
        color: var(--muted);
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 18px;
        line-height: 1.1;
      }

      .related-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 12px;
      }

      .related-title {
        margin: 0 0 6px;
        font-size: 15px;
        line-height: 1.2;
      }

      .related-author {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.25;
      }

      .site-footer {
        display: flex;
        justify-content: flex-end;
        margin-top: 34px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .privacy-link {
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .privacy-link:hover { text-decoration: underline; }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.58);
        color: var(--muted);
        padding: 40px;
        text-align: center;
      }

      @media (max-width: 820px) {
        .book { grid-template-columns: 1fr; }
        .cover-placeholder {
          min-height: 320px;
        }
      }

      @media (max-width: 560px) {
        .page {
          width: min(100% - 20px, 980px);
          padding-top: 18px;
        }

        .body { padding: 20px; }
        .details { grid-template-columns: 1fr; gap: 4px; }
        .related-header { align-items: stretch; flex-direction: column-reverse; }
        .related { padding: 14px; }
        .related-tabs { width: 100%; }
        .related-tab { flex: 1 1 auto; }
        .related-track { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      }
    </style>

  </head>
