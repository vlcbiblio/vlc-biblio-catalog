<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VLC Biblio</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ee;
        --ink: #26231f;
        --muted: #716b63;
        --line: #ddd4c5;
        --paper: #fffdf8;
        --green: #2f6f5e;
        --blue: #315f86;
        --gold: #b27728;
        --shadow: 0 14px 36px rgba(38, 35, 31, 0.1);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      input, select { font: inherit; }

      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .topbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 6vw, 64px);
        font-weight: 700;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        max-width: 700px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(84px, 1fr));
        gap: 8px;
        min-width: 310px;
      }

      .stat {
        padding: 12px 14px;
        border: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.68);
      }

      .stat strong {
        display: block;
        font-size: 24px;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .controls {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(240px, 1fr) minmax(160px, 220px);
        gap: 10px;
        padding: 16px 0 20px;
        background: rgba(247, 244, 238, 0.94);
        backdrop-filter: blur(12px);
      }

      .field {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        padding: 0 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 18px;
      }

      .book {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
        cursor: pointer;
      }

      .book:focus-visible {
        outline: 3px solid rgba(47, 111, 94, 0.35);
        outline-offset: 3px;
      }

      .cover {
        position: relative;
        aspect-ratio: 4 / 5.7;
        background: #e9e2d4;
      }

      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cover-placeholder {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        padding: 18px;
        color: var(--muted);
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 22px;
        line-height: 1.1;
      }

      .badge {
        position: absolute;
        left: 10px;
        top: 10px;
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.94);
        color: var(--ink);
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.library { color: var(--green); }
      .badge.exchange { color: var(--blue); }

      .body { padding: 14px; }

      .title {
        margin: 0 0 5px;
        font-size: 17px;
        line-height: 1.2;
      }

      .author {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .empty {
        display: none;
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 253, 248, 0.58);
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(38, 35, 31, 0.52);
      }

      .modal.is-open {
        display: flex;
      }

      .dialog {
        position: relative;
        display: grid;
        grid-template-columns: minmax(220px, 340px) minmax(0, 1fr);
        width: min(920px, 100%);
        max-height: min(780px, calc(100vh - 48px));
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: 0 24px 70px rgba(38, 35, 31, 0.28);
      }

      .dialog-cover {
        position: sticky;
        top: 0;
        align-self: start;
        min-height: 100%;
        background: #e9e2d4;
      }

      .dialog-cover img,
      .dialog-cover .cover-placeholder {
        width: 100%;
        height: 100%;
        min-height: 420px;
        object-fit: cover;
      }

      .dialog-body {
        padding: 28px;
      }

      .dialog-body > .badge {
        position: static;
        display: inline-flex;
      }

      .close {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.96);
        color: var(--ink);
        cursor: pointer;
        font-size: 24px;
        line-height: 1;
      }

      .dialog-title {
        margin: 12px 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.05;
      }

      .dialog-author {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 18px;
      }

      .details {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 8px 16px;
        margin: 22px 0;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .details dt {
        color: var(--muted);
        font-size: 13px;
      }

      .details dd {
        margin: 0;
        font-size: 14px;
      }

      .dialog-annotation {
        margin: 0;
        color: #4d473f;
        font-size: 15px;
        line-height: 1.55;
      }

      .dialog-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .dialog-links a {
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--blue);
        padding: 8px 10px;
        text-decoration: none;
      }

      .dialog-links a:hover {
        border-color: var(--blue);
      }

      @media (max-width: 820px) {
        .topbar { display: block; }
        .stats { min-width: 0; margin-top: 18px; }
        .controls { grid-template-columns: 1fr; }
        .dialog {
          grid-template-columns: 1fr;
        }

        .dialog-cover {
          position: relative;
        }

        .dialog-cover img,
        .dialog-cover .cover-placeholder {
          min-height: 320px;
          max-height: 460px;
        }
      }

      @media (max-width: 560px) {
        .page { width: min(100% - 20px, 1180px); padding-top: 18px; }
        .controls { position: static; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .body { padding: 11px; }
        .title { font-size: 14px; }
        .author { font-size: 12px; }
        .modal { padding: 10px; }
        .dialog-body { padding: 20px; }
        .details { grid-template-columns: 1fr; gap: 4px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="topbar" aria-labelledby="catalog-title">
        <div>
          <h1 id="catalog-title">VLC Biblio</h1>
          <p class="subtitle">
            Пополняемый каталог книг для русскоязычного фонда библиотеки Pilar Faus и
            книгообмена между участниками.
          </p>
        </div>
        <div class="stats" aria-label="Статистика каталога">
          <div class="stat"><strong id="totalCount">0</strong><span>всего</span></div>
          <div class="stat"><strong id="libraryCount">0</strong><span>в библиотеку</span></div>
          <div class="stat"><strong id="exchangeCount">0</strong><span>к обмену</span></div>
        </div>
      </section>

      <section class="controls" aria-label="Фильтры">
        <input class="field" id="search" type="search" placeholder="Поиск по названию или автору" />
        <select class="field" id="sectionFilter">
          <option value="">Все разделы</option>
          <option value="library">Для библиотеки</option>
          <option value="exchange">Книгообмен</option>
        </select>
      </section>

      <section class="grid" id="grid" aria-label="Книги"></section>
      <p class="empty" id="empty">Ничего не найдено. Попробуйте убрать часть фильтров.</p>
    </main>

    <div class="modal" id="bookModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <article class="dialog">
        <button class="close" id="modalClose" type="button" aria-label="Закрыть">×</button>
        <div class="dialog-cover" id="modalCover"></div>
        <div class="dialog-body">
          <span class="badge" id="modalStatus"></span>
          <h2 class="dialog-title" id="modalTitle"></h2>
          <p class="dialog-author" id="modalAuthor"></p>
          <dl class="details" id="modalDetails"></dl>
          <p class="dialog-annotation" id="modalAnnotation"></p>
          <div class="dialog-links" id="modalLinks"></div>
        </div>
      </article>
    </div>

    <script src="./data/books.js"></script>
    <script>
      const books = Array.isArray(window.BIBLIO_BOOKS) ? window.BIBLIO_BOOKS : [];

      const labels = {
        library: "В библиотеку",
        exchange: "Книгообмен",
      };

      const state = { search: "", section: "" };
      const grid = document.querySelector("#grid");
      const empty = document.querySelector("#empty");
      const modal = document.querySelector("#bookModal");
      const modalClose = document.querySelector("#modalClose");
      const modalCover = document.querySelector("#modalCover");
      const modalStatus = document.querySelector("#modalStatus");
      const modalTitle = document.querySelector("#modalTitle");
      const modalAuthor = document.querySelector("#modalAuthor");
      const modalDetails = document.querySelector("#modalDetails");
      const modalAnnotation = document.querySelector("#modalAnnotation");
      const modalLinks = document.querySelector("#modalLinks");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function matches(book) {
        const query = state.search.trim().toLocaleLowerCase("ru");
        const text = [book.title, book.author, book.isbn, book.publisher, book.annotation]
          .join(" ")
          .toLocaleLowerCase("ru");

        return (
          (!query || text.includes(query)) &&
          (!state.section || book.section === state.section)
        );
      }

      function renderDetails(book) {
        const details = [
          ["Статус", book.catalogStatus],
          ["ISBN", book.isbn],
          ["Год выпуска", book.year],
          ["Издательство", book.publisher],
        ].filter(([, value]) => value);

        return details
          .map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`)
          .join("");
      }

      function openBook(book) {
        modalCover.innerHTML = book.cover
          ? `<img src="${escapeHtml(book.cover)}" alt="Обложка: ${escapeHtml(book.title)}" />`
          : `<div class="cover-placeholder">${escapeHtml(book.title || "Книга")}</div>`;
        modalStatus.className = `badge ${escapeHtml(book.section)}`;
        modalStatus.textContent = book.catalogStatus || labels[book.section] || "Книга";
        modalTitle.textContent = book.title || "Без названия";
        modalAuthor.textContent = book.author || "Автор не указан";
        modalDetails.innerHTML = renderDetails(book);
        modalAnnotation.textContent = book.annotation || "Описание пока не добавлено.";
        modalLinks.innerHTML = [
          book.sourceUrl ? `<a href="${escapeHtml(book.sourceUrl)}" target="_blank" rel="noreferrer">Источник</a>` : "",
          book.livelibUrl ? `<a href="${escapeHtml(book.livelibUrl)}" target="_blank" rel="noreferrer">LiveLib</a>` : "",
          book.wildberriesUrl ? `<a href="${escapeHtml(book.wildberriesUrl)}" target="_blank" rel="noreferrer">Wildberries</a>` : "",
        ]
          .filter(Boolean)
          .join("");

        modal.classList.add("is-open");
        document.body.style.overflow = "hidden";
        modalClose.focus();
      }

      function closeBook() {
        modal.classList.remove("is-open");
        document.body.style.overflow = "";
      }

      function render() {
        const visible = books.filter(matches);

        document.querySelector("#totalCount").textContent = visible.length;
        document.querySelector("#libraryCount").textContent = visible.filter(
          (book) => book.section === "library",
        ).length;
        document.querySelector("#exchangeCount").textContent = visible.filter(
          (book) => book.section === "exchange",
        ).length;

        grid.innerHTML = visible
          .map((book) => {
            return `
              <article class="book" tabindex="0" role="button" data-book-id="${escapeHtml(book.id)}" aria-label="Открыть карточку: ${escapeHtml(book.title)}">
                <div class="cover">
                  ${
                    book.cover
                      ? `<img src="${escapeHtml(book.cover)}" alt="Обложка: ${escapeHtml(book.title)}" loading="lazy" />`
                      : `<div class="cover-placeholder">${escapeHtml(book.title || "Книга")}</div>`
                  }
                  <span class="badge ${escapeHtml(book.section)}">${escapeHtml(book.catalogStatus || labels[book.section] || "Книга")}</span>
                </div>
                <div class="body">
                  <h2 class="title">${escapeHtml(book.title || "Без названия")}</h2>
                  <p class="author">${escapeHtml(book.author || "Автор не указан")}</p>
                </div>
              </article>
            `;
          })
          .join("");

        empty.style.display = visible.length ? "none" : "block";
      }

      document.querySelector("#search").addEventListener("input", (event) => {
        state.search = event.target.value;
        render();
      });

      document.querySelector("#sectionFilter").addEventListener("change", (event) => {
        state.section = event.target.value;
        render();
      });

      grid.addEventListener("click", (event) => {
        const card = event.target.closest("[data-book-id]");
        if (!card) return;
        const book = books.find((item) => String(item.id) === card.dataset.bookId);
        if (book) openBook(book);
      });

      grid.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-book-id]");
        if (!card) return;
        event.preventDefault();
        const book = books.find((item) => String(item.id) === card.dataset.bookId);
        if (book) openBook(book);
      });

      modalClose.addEventListener("click", closeBook);
      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeBook();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("is-open")) closeBook();
      });

      render();
    </script>
  </body>
</html>
