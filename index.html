<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VLC Biblio</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ee;
        --ink: #26231f;
        --muted: #716b63;
        --line: #ddd4c5;
        --paper: #fffdf8;
        --green: #2f6f5e;
        --blue: #315f86;
        --gold: #b27728;
        --shadow: 0 14px 36px rgba(38, 35, 31, 0.1);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      input, select, button { font: inherit; }

      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .topbar {
        display: flex;
        align-items: stretch;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      .brand-plaque {
        width: min(760px, 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.72);
        padding: 12px 14px;
      }

      h1 {
        margin: 0 0 3px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1;
      }

      .subtitle {
        margin: 0;
        max-width: 640px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      .telegram-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        margin-top: 10px;
      }

      .telegram-link,
      .telegram-action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .telegram-link {
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .telegram-link:hover { text-decoration: underline; }

      .telegram-icon {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
        fill: currentColor;
      }

      .stats {
        align-self: end;
        display: grid;
        grid-template-columns: repeat(3, minmax(84px, 1fr));
        gap: 8px;
        min-width: 310px;
      }

      .stat {
        padding: 12px 14px;
        border: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.68);
      }

      .stat strong {
        display: block;
        font-size: 24px;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .controls {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(240px, 1fr) minmax(150px, 220px);
        gap: 10px;
        padding: 16px 0 20px;
        background: rgba(247, 244, 238, 0.94);
        backdrop-filter: blur(12px);
      }

      .field {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        padding: 0 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 18px;
      }

      .book {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
        cursor: pointer;
      }

      .book:focus-visible {
        outline: 3px solid rgba(47, 111, 94, 0.35);
        outline-offset: 3px;
      }

      .cover {
        position: relative;
        aspect-ratio: 4 / 5.7;
        background: #e9e2d4;
      }

      .cover.is-broken,
      .dialog-cover.is-broken {
        background: #eee7d8;
      }

      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cover-placeholder {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        padding: 18px;
        color: var(--muted);
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 22px;
        line-height: 1.1;
      }

      .badge {
        position: absolute;
        left: 10px;
        top: 10px;
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.94);
        color: var(--ink);
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.library { color: var(--green); }
      .badge.exchange { color: var(--blue); }

      .body {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 14px;
      }

      .title {
        margin: 0 0 5px;
        font-size: 17px;
        line-height: 1.2;
      }

      .author {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .meta {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .card-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        min-height: 36px;
        margin-top: auto;
        border: 1px solid var(--blue);
        border-radius: 6px;
        color: var(--blue);
        background: rgba(49, 95, 134, 0.06);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .card-action:hover {
        background: rgba(49, 95, 134, 0.12);
      }

      .empty {
        display: none;
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 253, 248, 0.58);
      }

      .modal {
        display: none;
        padding: 24px 0 0;
      }

      .modal.is-open { display: block; }

      .dialog {
        position: relative;
        display: grid;
        grid-template-columns: minmax(220px, 340px) minmax(0, 1fr);
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .dialog-cover {
        position: sticky;
        top: 0;
        align-self: start;
        min-height: 100%;
        background: #e9e2d4;
      }

      .dialog-cover img,
      .dialog-cover .cover-placeholder {
        width: 100%;
        height: 100%;
        min-height: 420px;
        object-fit: cover;
      }

      .dialog-body { padding: 28px; }

      .dialog-body > .badge {
        position: static;
        display: inline-flex;
        margin-right: 8px;
      }

      .close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(255, 253, 248, 0.96);
        color: var(--ink);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 18px;
        padding: 0 12px;
      }

      .dialog-title {
        margin: 12px 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.05;
      }

      .dialog-author {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 18px;
      }

      .details {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 8px 16px;
        margin: 22px 0;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .details dt {
        color: var(--muted);
        font-size: 13px;
      }

      .details dd {
        margin: 0;
        font-size: 14px;
      }

      .dialog-annotation {
        margin: 0;
        color: #4d473f;
        font-size: 15px;
        line-height: 1.55;
      }

      .collection-note {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
      }

      .dialog-links,
      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .dialog-links a,
      .dialog-actions a,
      .dialog-actions button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--blue);
        padding: 8px 10px;
        text-decoration: none;
        cursor: pointer;
      }

      .dialog-links a:hover,
      .dialog-actions a:hover,
      .dialog-actions button:hover {
        border-color: var(--blue);
      }

      @media (max-width: 820px) {
        .topbar { display: block; }
        .brand-plaque { width: 100%; }
        .stats { min-width: 0; margin-top: 12px; }
        .controls { grid-template-columns: 1fr 1fr; }
        .controls .search { grid-column: 1 / -1; }
        .dialog { grid-template-columns: 1fr; }
        .dialog-cover { position: relative; }
        .dialog-cover img,
        .dialog-cover .cover-placeholder {
          min-height: 320px;
          max-height: 460px;
        }
      }

      @media (max-width: 560px) {
        .page { width: min(100% - 20px, 1180px); padding-top: 18px; }
        .brand-plaque {
          padding: 14px;
        }
        .controls { position: static; grid-template-columns: 1fr; }
        .controls .search { grid-column: auto; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .body { padding: 11px; }
        .title { font-size: 14px; }
        .author { font-size: 12px; }
        .dialog-body { padding: 20px; }
        .details { grid-template-columns: 1fr; gap: 4px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="topbar" aria-labelledby="catalog-title">
        <div class="brand-plaque">
          <h1 id="catalog-title">VLC Biblio</h1>
          <p class="subtitle">
            Пополняемый каталог книг для русскоязычного фонда библиотеки Pilar Faus и
            частных библиотек участников.
          </p>
          <nav class="telegram-links" aria-label="Telegram">
            <a class="telegram-link" href="https://t.me/VLC_biblio" target="_blank" rel="noreferrer">
              <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 4.3 18.4 20c-.2 1-.8 1.2-1.6.8l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.3L6 13.5l-4.8-1.5c-1-.3-1-1 .2-1.5L20.2 3.2c.9-.3 1.7.2 1.5 1.1Z"/></svg>
              <span>@VLC_biblio канал</span>
            </a>
            <a class="telegram-link" href="https://t.me/bibliotecavlc" target="_blank" rel="noreferrer">
              <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 4.3 18.4 20c-.2 1-.8 1.2-1.6.8l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.3L6 13.5l-4.8-1.5c-1-.3-1-1 .2-1.5L20.2 3.2c.9-.3 1.7.2 1.5 1.1Z"/></svg>
              <span>@bibliotecavlc чат</span>
            </a>
            <a class="telegram-link" href="https://t.me/VLS_Biblio_bot" target="_blank" rel="noreferrer">
              <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 4.3 18.4 20c-.2 1-.8 1.2-1.6.8l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.3L6 13.5l-4.8-1.5c-1-.3-1-1 .2-1.5L20.2 3.2c.9-.3 1.7.2 1.5 1.1Z"/></svg>
              <span>@VLS_Biblio_bot бот</span>
            </a>
          </nav>
        </div>
        <div class="stats" aria-label="Статистика каталога">
          <div class="stat"><strong id="totalCount">0</strong><span>всего</span></div>
          <div class="stat"><strong id="libraryCount">0</strong><span>в библиотеку</span></div>
          <div class="stat"><strong id="exchangeCount">0</strong><span>частные</span></div>
        </div>
      </section>

      <section class="controls" aria-label="Фильтры">
        <input class="field search" id="search" type="search" placeholder="Поиск по названию, автору, ISBN или издательству" />
        <select class="field" id="sectionFilter">
          <option value="">Все разделы</option>
          <option value="library">Библиотека Pilar Faus</option>
          <option value="exchange">Частная библиотека</option>
        </select>
      </section>

      <section class="grid" id="grid" aria-label="Книги"></section>
      <p class="empty" id="empty">Ничего не найдено. Попробуйте убрать часть фильтров.</p>
    </main>

    <section class="modal" id="bookModal" aria-labelledby="modalTitle">
      <button class="close" id="modalClose" type="button">← Назад к каталогу</button>
      <article class="dialog">
        <div class="dialog-cover" id="modalCover"></div>
        <div class="dialog-body">
          <span class="badge" id="modalStatus"></span>
          <h2 class="dialog-title" id="modalTitle"></h2>
          <p class="dialog-author" id="modalAuthor"></p>
          <dl class="details" id="modalDetails"></dl>
          <p class="dialog-annotation" id="modalAnnotation"></p>
          <p class="collection-note" id="modalCollectionNote"></p>
          <div class="dialog-actions" id="modalActions"></div>
          <div class="dialog-links" id="modalLinks"></div>
        </div>
      </article>
    </section>

    <script src="./data/books.js?v=20260910224000"></script>
    <script>
      const books = Array.isArray(window.BIBLIO_BOOKS) ? window.BIBLIO_BOOKS : [];
      const botUrl = "https://t.me/VLS_Biblio_bot";
      const libraryMapUrl = "https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20de%20Val%C3%A8ncia%20Pilar%20Faus%2039.470374%2C-0.381743";

      const labels = {
        library: "Библиотека Pilar Faus",
        exchange: "Частная библиотека",
      };

      const state = {
        search: "",
        section: "",
      };

      const grid = document.querySelector("#grid");
      const controls = document.querySelector(".controls");
      const empty = document.querySelector("#empty");
      const modal = document.querySelector("#bookModal");
      const modalClose = document.querySelector("#modalClose");
      const modalCover = document.querySelector("#modalCover");
      const modalStatus = document.querySelector("#modalStatus");
      const modalTitle = document.querySelector("#modalTitle");
      const modalAuthor = document.querySelector("#modalAuthor");
      const modalDetails = document.querySelector("#modalDetails");
      const modalAnnotation = document.querySelector("#modalAnnotation");
      const modalCollectionNote = document.querySelector("#modalCollectionNote");
      const modalActions = document.querySelector("#modalActions");
      const modalLinks = document.querySelector("#modalLinks");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function compact(value) {
        return String(value ?? "").trim();
      }

      function normalize(value) {
        return compact(value).toLocaleLowerCase("ru");
      }

      function bookDate(book) {
        const value = Date.parse(book.updatedAt || book.addedAt || "");
        return Number.isNaN(value) ? 0 : value;
      }

      function matches(book) {
        const query = normalize(state.search);
        const text = normalize([book.title, book.author, book.isbn, book.publisher, book.annotation].join(" "));

        return (
          (!query || text.includes(query)) &&
          (!state.section || book.section === state.section)
        );
      }

      function sorted(list) {
        return [...list].sort((a, b) => bookDate(b) - bookDate(a));
      }

      function renderDetails(book) {
        const details = [
          book.section === "exchange" ? null : ["Статус", book.catalogStatus],
          ["ISBN", book.isbn],
          ["Год выпуска", book.year],
          ["Издательство", book.publisher],
          ["Обновлено", book.updatedAt ? new Date(book.updatedAt).toLocaleDateString("ru") : ""],
        ].filter((detail) => detail && detail[1]);

        return details
          .map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`)
          .join("");
      }

      function fallbackCover(title) {
        return `<div class="cover-placeholder">${escapeHtml(title || "Книга")}</div>`;
      }

      function coverMarkup(book, lazy = false) {
        if (!book.cover) return fallbackCover(book.title);
        return `<img src="${escapeHtml(book.cover)}" alt="Обложка: ${escapeHtml(book.title)}"${lazy ? " loading=\"lazy\"" : ""} decoding="async" referrerpolicy="no-referrer" data-fallback-title="${escapeHtml(book.title || "Книга")}" />`;
      }

      function telegramIcon() {
        return `<svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 4.3 18.4 20c-.2 1-.8 1.2-1.6.8l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.3L6 13.5l-4.8-1.5c-1-.3-1-1 .2-1.5L20.2 3.2c.9-.3 1.7.2 1.5 1.1Z"/></svg>`;
      }

      function actionLabelMarkup(action) {
        const label = `<span>${escapeHtml(action.label)}</span>`;
        return action.isTelegram ? `${telegramIcon()}${label}` : label;
      }

      function requestUrl(book) {
        const key = encodeURIComponent(`book_${book.requestId || book.id || book.isbn || ""}`.replaceAll("-", ""));
        return `${botUrl}?start=${key}`;
      }

      function googleSearchUrl(book) {
        const query = [book.title, book.isbn].map(compact).filter(Boolean).join(" ");
        return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      }

      function canRequestBook(book) {
        return book.section === "exchange" && book.availability === "available";
      }

      function libraryAction(book) {
        if (canRequestBook(book)) {
          return {
            href: requestUrl(book),
            label: "Запросить книгу через Телеграм",
            isTelegram: true,
          };
        }
        if (book.section === "library") {
          return {
            href: libraryMapUrl,
            label: "Библиотека Pilar Faus",
          };
        }
        return null;
      }

      function collectionNote(book) {
        if (book.section === "exchange") {
          return "Книга в частной коллекции. Вы можете запросить книгу на время.";
        }
        return "Книга в библиотеке Pilar Faus.";
      }

      function badgeMarkup(book) {
        if (book.section === "exchange") return "";
        return `<span class="badge ${escapeHtml(book.section)}">${escapeHtml(book.catalogStatus || labels[book.section] || "Книга")}</span>`;
      }

      function bookPageUrl(book) {
        const url = new URL("book.html", window.location.href);
        url.search = "";
        url.searchParams.set("id", book.id);
        return `${url.pathname}${url.search}`;
      }

      function currentBookFromUrl() {
        const id = new URLSearchParams(window.location.search).get("book");
        if (!id) return null;
        return books.find((book) => String(book.id) === String(id)) || null;
      }

      function openBook(book, options = {}) {
        if (options.push === false) {
          window.location.replace(bookPageUrl(book));
          return;
        }
        window.location.href = bookPageUrl(book);
        return;
        const shouldPush = options.push !== false;
        modalCover.classList.remove("is-broken");
        modalCover.innerHTML = coverMarkup(book);
        modalStatus.className = `badge ${escapeHtml(book.section)}`;
        modalStatus.textContent = book.section === "exchange" ? "" : book.catalogStatus || labels[book.section] || "Книга";
        modalStatus.hidden = book.section === "exchange";
        modalTitle.textContent = book.title || "Без названия";
        modalAuthor.textContent = book.author || "Автор не указан";
        modalDetails.innerHTML = renderDetails(book);
        modalAnnotation.textContent = book.annotation || "Описание пока не добавлено.";
        modalCollectionNote.textContent = collectionNote(book);
        modalActions.innerHTML = [
          libraryAction(book)
            ? `<a class="${libraryAction(book).isTelegram ? "telegram-action" : ""}" href="${escapeHtml(libraryAction(book).href)}" target="_blank" rel="noreferrer">${actionLabelMarkup(libraryAction(book))}</a>`
            : "",
        ].filter(Boolean).join("");
        modalLinks.innerHTML = `<a href="${escapeHtml(googleSearchUrl(book))}" target="_blank" rel="noreferrer">Google</a>`;

        controls.hidden = true;
        grid.hidden = true;
        empty.style.display = "none";
        modal.classList.add("is-open");
        if (shouldPush) history.pushState({ bookId: book.id }, "", bookPageUrl(book));
        window.scrollTo({ top: 0, behavior: shouldPush ? "smooth" : "auto" });
        modalClose.focus();
      }

      function closeBook(options = {}) {
        const shouldPush = options.push !== false;
        modal.classList.remove("is-open");
        controls.hidden = false;
        grid.hidden = false;
        if (shouldPush) {
          const url = new URL(window.location.href);
          url.searchParams.delete("book");
          history.pushState({}, "", `${url.pathname}${url.search}${url.hash}`);
        }
        render();
      }

      function replaceBrokenCover(image) {
        const container = image.closest(".cover, .dialog-cover");
        if (container) container.classList.add("is-broken");
        image.replaceWith(document.createRange().createContextualFragment(fallbackCover(image.dataset.fallbackTitle)));
      }

      function render() {
        const visible = sorted(books.filter(matches));

        document.querySelector("#totalCount").textContent = visible.length;
        document.querySelector("#libraryCount").textContent = visible.filter((book) => book.section === "library").length;
        document.querySelector("#exchangeCount").textContent = visible.filter((book) => book.section === "exchange").length;

        grid.innerHTML = visible
          .map((book) => `
            <article class="book" tabindex="0" role="button" data-book-id="${escapeHtml(book.id)}" aria-label="Открыть карточку: ${escapeHtml(book.title)}">
              <div class="cover">
                ${coverMarkup(book, true)}
                ${badgeMarkup(book)}
              </div>
              <div class="body">
                <h2 class="title">${escapeHtml(book.title || "Без названия")}</h2>
                <p class="author">${escapeHtml(book.author || "Автор не указан")}</p>
                <p class="meta">${escapeHtml([book.publisher, book.year].filter(Boolean).join(" · "))}</p>
                ${libraryAction(book) ? `<a class="card-action ${libraryAction(book).isTelegram ? "telegram-action" : ""}" href="${escapeHtml(libraryAction(book).href)}" target="_blank" rel="noreferrer">${actionLabelMarkup(libraryAction(book))}</a>` : ""}
              </div>
            </article>
          `)
          .join("");

        empty.style.display = visible.length ? "none" : "block";
      }

      document.querySelector("#search").addEventListener("input", (event) => {
        state.search = event.target.value;
        render();
      });

      [
        ["#sectionFilter", "section"],
      ].forEach(([selector, key]) => {
        document.querySelector(selector).addEventListener("change", (event) => {
          state[key] = event.target.value;
          render();
        });
      });

      grid.addEventListener("click", (event) => {
        if (event.target.closest("a, button")) return;
        const card = event.target.closest("[data-book-id]");
        if (!card) return;
        const book = books.find((item) => String(item.id) === card.dataset.bookId);
        if (book) openBook(book);
      });

      grid.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-book-id]");
        if (!card) return;
        event.preventDefault();
        const book = books.find((item) => String(item.id) === card.dataset.bookId);
        if (book) openBook(book);
      });

      grid.addEventListener("error", (event) => {
        if (event.target.tagName !== "IMG") return;
        replaceBrokenCover(event.target);
      }, true);

      modalCover.addEventListener("error", (event) => {
        if (event.target.tagName !== "IMG") return;
        replaceBrokenCover(event.target);
      }, true);

      modalClose.addEventListener("click", closeBook);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("is-open")) closeBook();
      });
      window.addEventListener("popstate", () => {
        const book = currentBookFromUrl();
        if (book) {
          openBook(book, { push: false });
        } else {
          closeBook({ push: false });
        }
      });

      const initialBook = currentBookFromUrl();
      if (initialBook) {
        openBook(initialBook, { push: false });
      } else {
        render();
      }
    </script>
  </body>
</html>
