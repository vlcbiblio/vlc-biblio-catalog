<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VLC Biblio Catalog</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ee;
        --ink: #26231f;
        --muted: #716b63;
        --line: #ddd4c5;
        --paper: #fffdf8;
        --green: #2f6f5e;
        --blue: #315f86;
        --red: #9b4b42;
        --gold: #b27728;
        --shadow: 0 14px 36px rgba(38, 35, 31, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .topbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 6vw, 64px);
        font-weight: 700;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        max-width: 680px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(84px, 1fr));
        gap: 8px;
        min-width: 310px;
      }

      .stat {
        padding: 12px 14px;
        border: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.68);
      }

      .stat strong {
        display: block;
        font-size: 24px;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .controls {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) repeat(3, minmax(150px, 190px));
        gap: 10px;
        padding: 16px 0;
        background: rgba(247, 244, 238, 0.94);
        backdrop-filter: blur(12px);
      }

      .field {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        padding: 0 12px;
      }

      .tagbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }

      .chip {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        padding: 0 13px;
        cursor: pointer;
      }

      .chip.is-active {
        border-color: var(--green);
        background: var(--green);
        color: #fff;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 18px;
      }

      .book {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .cover {
        position: relative;
        aspect-ratio: 4 / 5.7;
        background: #e9e2d4;
      }

      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .badge {
        position: absolute;
        left: 10px;
        top: 10px;
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.94);
        color: var(--ink);
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.library {
        color: var(--green);
      }

      .badge.exchange {
        color: var(--blue);
      }

      .body {
        padding: 14px;
      }

      .title {
        margin: 0 0 5px;
        font-size: 17px;
        line-height: 1.2;
      }

      .author {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }

      .pill {
        border-radius: 999px;
        background: #eee7da;
        color: #5c554b;
        padding: 4px 8px;
        font-size: 12px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        border-radius: 4px;
        padding: 0 8px;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }

      .available {
        background: var(--green);
      }

      .pending {
        background: var(--gold);
      }

      .reserved {
        background: var(--red);
      }

      .empty {
        display: none;
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 253, 248, 0.58);
      }

      @media (max-width: 820px) {
        .topbar {
          display: block;
        }

        .stats {
          min-width: 0;
          margin-top: 18px;
        }

        .controls {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 560px) {
        .page {
          width: min(100% - 20px, 1180px);
          padding-top: 18px;
        }

        .controls {
          position: static;
          grid-template-columns: 1fr;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .body {
          padding: 11px;
        }

        .title {
          font-size: 14px;
        }

        .author {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="topbar" aria-labelledby="catalog-title">
        <div>
          <h1 id="catalog-title">VLC Biblio</h1>
          <p class="subtitle">
            Пополняемый каталог книг для русскоязычного фонда библиотеки Pilar Faus и
            книгообмена между участниками.
          </p>
        </div>
        <div class="stats" aria-label="Статистика каталога">
          <div class="stat"><strong id="totalCount">0</strong><span>всего</span></div>
          <div class="stat"><strong id="libraryCount">0</strong><span>в библиотеку</span></div>
          <div class="stat"><strong id="exchangeCount">0</strong><span>к обмену</span></div>
        </div>
      </section>

      <section class="controls" aria-label="Фильтры">
        <input class="field" id="search" type="search" placeholder="Поиск по названию или автору" />
        <select class="field" id="sectionFilter">
          <option value="">Все разделы</option>
          <option value="library">Для библиотеки</option>
          <option value="exchange">Книгообмен</option>
        </select>
        <select class="field" id="ageFilter">
          <option value="">Любой возраст</option>
          <option value="Детские">Детские</option>
          <option value="Подростковые">Подростковые</option>
          <option value="Взрослые">Взрослые</option>
        </select>
        <select class="field" id="statusFilter">
          <option value="">Любой статус</option>
          <option value="Доступна">Доступна</option>
          <option value="На согласовании">На согласовании</option>
          <option value="Забронирована">Забронирована</option>
        </select>
      </section>

      <nav class="tagbar" id="tagbar" aria-label="Теги"></nav>

      <section class="grid" id="grid" aria-label="Книги"></section>
      <p class="empty" id="empty">Ничего не найдено. Попробуйте убрать часть фильтров.</p>
    </main>

    <script>
      const books = [
        {
          title: "Маленький принц",
          author: "Антуан де Сент-Экзюпери",
          section: "library",
          age: "Детские",
          status: "На согласовании",
          tags: ["классика", "сказка", "французская литература"],
          cover: "https://covers.openlibrary.org/b/isbn/9780156012195-L.jpg",
        },
        {
          title: "Гарри Поттер и философский камень",
          author: "Дж. К. Роулинг",
          section: "exchange",
          age: "Подростковые",
          status: "Доступна",
          tags: ["фэнтези", "приключения", "серия"],
          cover: "https://covers.openlibrary.org/b/isbn/9780439708180-L.jpg",
        },
        {
          title: "1984",
          author: "Джордж Оруэлл",
          section: "library",
          age: "Взрослые",
          status: "На согласовании",
          tags: ["антиутопия", "классика", "политика"],
          cover: "https://covers.openlibrary.org/b/isbn/9780451524935-L.jpg",
        },
        {
          title: "Вино из одуванчиков",
          author: "Рэй Брэдбери",
          section: "exchange",
          age: "Взрослые",
          status: "Забронирована",
          tags: ["проза", "американская литература", "лето"],
          cover: "https://covers.openlibrary.org/b/isbn/9780553277531-L.jpg",
        },
        {
          title: "Муфта, Полботинка и Моховая Борода",
          author: "Эно Рауд",
          section: "library",
          age: "Детские",
          status: "Доступна",
          tags: ["детские", "приключения", "юмор"],
          cover: "https://covers.openlibrary.org/b/isbn/9785170854264-L.jpg",
        },
        {
          title: "Sapiens",
          author: "Юваль Ной Харари",
          section: "exchange",
          age: "Взрослые",
          status: "Доступна",
          tags: ["нон-фикшн", "история", "общество"],
          cover: "https://covers.openlibrary.org/b/isbn/9780062316097-L.jpg",
        },
      ];

      const labels = {
        library: "В библиотеку",
        exchange: "Книгообмен",
      };

      const statusClass = {
        Доступна: "available",
        "На согласовании": "pending",
        Забронирована: "reserved",
      };

      const state = {
        search: "",
        section: "",
        age: "",
        status: "",
        tag: "",
      };

      const grid = document.querySelector("#grid");
      const empty = document.querySelector("#empty");
      const tagbar = document.querySelector("#tagbar");
      const allTags = [...new Set(books.flatMap((book) => book.tags))].sort((a, b) =>
        a.localeCompare(b, "ru"),
      );

      function renderTags() {
        tagbar.innerHTML = [
          `<button class="chip ${state.tag === "" ? "is-active" : ""}" data-tag="">Все теги</button>`,
          ...allTags.map(
            (tag) =>
              `<button class="chip ${state.tag === tag ? "is-active" : ""}" data-tag="${tag}">${tag}</button>`,
          ),
        ].join("");
      }

      function matches(book) {
        const query = state.search.trim().toLocaleLowerCase("ru");
        const text = `${book.title} ${book.author}`.toLocaleLowerCase("ru");

        return (
          (!query || text.includes(query)) &&
          (!state.section || book.section === state.section) &&
          (!state.age || book.age === state.age) &&
          (!state.status || book.status === state.status) &&
          (!state.tag || book.tags.includes(state.tag))
        );
      }

      function render() {
        const visible = books.filter(matches);

        document.querySelector("#totalCount").textContent = visible.length;
        document.querySelector("#libraryCount").textContent = visible.filter(
          (book) => book.section === "library",
        ).length;
        document.querySelector("#exchangeCount").textContent = visible.filter(
          (book) => book.section === "exchange",
        ).length;

        grid.innerHTML = visible
          .map(
            (book) => `
              <article class="book">
                <div class="cover">
                  <img src="${book.cover}" alt="Обложка: ${book.title}" loading="lazy" />
                  <span class="badge ${book.section}">${labels[book.section]}</span>
                </div>
                <div class="body">
                  <h2 class="title">${book.title}</h2>
                  <p class="author">${book.author}</p>
                  <div class="meta">
                    <span class="pill">${book.age}</span>
                    ${book.tags.map((tag) => `<span class="pill">${tag}</span>`).join("")}
                  </div>
                  <span class="status ${statusClass[book.status]}">${book.status}</span>
                </div>
              </article>
            `,
          )
          .join("");

        empty.style.display = visible.length ? "none" : "block";
        renderTags();
      }

      document.querySelector("#search").addEventListener("input", (event) => {
        state.search = event.target.value;
        render();
      });

      document.querySelector("#sectionFilter").addEventListener("change", (event) => {
        state.section = event.target.value;
        render();
      });

      document.querySelector("#ageFilter").addEventListener("change", (event) => {
        state.age = event.target.value;
        render();
      });

      document.querySelector("#statusFilter").addEventListener("change", (event) => {
        state.status = event.target.value;
        render();
      });

      tagbar.addEventListener("click", (event) => {
        const button = event.target.closest("[data-tag]");
        if (!button) return;
        state.tag = button.dataset.tag;
        render();
      });

      render();
    </script>
  </body>
</html>
