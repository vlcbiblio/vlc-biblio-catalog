<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VLC Biblio</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ee;
        --ink: #26231f;
        --muted: #716b63;
        --line: #ddd4c5;
        --paper: #fffdf8;
        --green: #2f6f5e;
        --blue: #315f86;
        --gold: #b27728;
        --shadow: 0 14px 36px rgba(38, 35, 31, 0.1);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      input, select { font: inherit; }

      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .topbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 6vw, 64px);
        font-weight: 700;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        max-width: 700px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(84px, 1fr));
        gap: 8px;
        min-width: 310px;
      }

      .stat {
        padding: 12px 14px;
        border: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.68);
      }

      .stat strong {
        display: block;
        font-size: 24px;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .controls {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(240px, 1fr) minmax(160px, 220px) minmax(160px, 220px);
        gap: 10px;
        padding: 16px 0 20px;
        background: rgba(247, 244, 238, 0.94);
        backdrop-filter: blur(12px);
      }

      .field {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        padding: 0 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 18px;
      }

      .book {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .cover {
        position: relative;
        aspect-ratio: 4 / 5.7;
        background: #e9e2d4;
      }

      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cover-placeholder {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        padding: 18px;
        color: var(--muted);
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 22px;
        line-height: 1.1;
      }

      .badge {
        position: absolute;
        left: 10px;
        top: 10px;
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.94);
        color: var(--ink);
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.library { color: var(--green); }
      .badge.exchange { color: var(--blue); }

      .body { padding: 14px; }

      .title {
        margin: 0 0 5px;
        font-size: 17px;
        line-height: 1.2;
      }

      .author {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }

      .pill {
        border-radius: 999px;
        background: #eee7da;
        color: #5c554b;
        padding: 4px 8px;
        font-size: 12px;
      }

      .annotation {
        display: -webkit-box;
        margin: 0 0 12px;
        overflow: hidden;
        color: #4d473f;
        font-size: 13px;
        line-height: 1.4;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .links a {
        color: var(--blue);
        font-size: 13px;
        text-decoration: none;
      }

      .links a:hover { text-decoration: underline; }

      .empty {
        display: none;
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 253, 248, 0.58);
      }

      @media (max-width: 820px) {
        .topbar { display: block; }
        .stats { min-width: 0; margin-top: 18px; }
        .controls { grid-template-columns: 1fr; }
      }

      @media (max-width: 560px) {
        .page { width: min(100% - 20px, 1180px); padding-top: 18px; }
        .controls { position: static; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .body { padding: 11px; }
        .title { font-size: 14px; }
        .author, .annotation, .links a { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="topbar" aria-labelledby="catalog-title">
        <div>
          <h1 id="catalog-title">VLC Biblio</h1>
          <p class="subtitle">
            Пополняемый каталог книг для русскоязычного фонда библиотеки Pilar Faus и
            книгообмена между участниками.
          </p>
        </div>
        <div class="stats" aria-label="Статистика каталога">
          <div class="stat"><strong id="totalCount">0</strong><span>всего</span></div>
          <div class="stat"><strong id="libraryCount">0</strong><span>в библиотеку</span></div>
          <div class="stat"><strong id="exchangeCount">0</strong><span>к обмену</span></div>
        </div>
      </section>

      <section class="controls" aria-label="Фильтры">
        <input class="field" id="search" type="search" placeholder="Поиск по названию, автору, ISBN" />
        <select class="field" id="sectionFilter">
          <option value="">Все разделы</option>
          <option value="library">Для библиотеки</option>
          <option value="exchange">Книгообмен</option>
        </select>
        <select class="field" id="statusFilter">
          <option value="">Любой статус</option>
        </select>
      </section>

      <section class="grid" id="grid" aria-label="Книги"></section>
      <p class="empty" id="empty">Ничего не найдено. Попробуйте убрать часть фильтров.</p>
    </main>

    <script src="./data/books.js"></script>
    <script>
      const books = Array.isArray(window.BIBLIO_BOOKS) ? window.BIBLIO_BOOKS : [];

      const labels = {
        library: "В библиотеку",
        exchange: "Книгообмен",
      };

      const statusLabels = {
        metadata_found: "Данные найдены",
        processed: "Обработана",
      };

      const state = { search: "", section: "", status: "" };
      const grid = document.querySelector("#grid");
      const empty = document.querySelector("#empty");
      const statusFilter = document.querySelector("#statusFilter");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function getStatusLabel(status) {
        return statusLabels[status] || status || "Без статуса";
      }

      function renderStatusOptions() {
        const statuses = [...new Set(books.map((book) => book.status).filter(Boolean))].sort();
        statusFilter.innerHTML = [
          '<option value="">Любой статус</option>',
          ...statuses.map(
            (status) => `<option value="${escapeHtml(status)}">${escapeHtml(getStatusLabel(status))}</option>`,
          ),
        ].join("");
      }

      function matches(book) {
        const query = state.search.trim().toLocaleLowerCase("ru");
        const text = [book.title, book.author, book.isbn, book.publisher, book.annotation]
          .join(" ")
          .toLocaleLowerCase("ru");

        return (
          (!query || text.includes(query)) &&
          (!state.section || book.section === state.section) &&
          (!state.status || book.status === state.status)
        );
      }

      function render() {
        const visible = books.filter(matches);

        document.querySelector("#totalCount").textContent = visible.length;
        document.querySelector("#libraryCount").textContent = visible.filter(
          (book) => book.section === "library",
        ).length;
        document.querySelector("#exchangeCount").textContent = visible.filter(
          (book) => book.section === "exchange",
        ).length;

        grid.innerHTML = visible
          .map((book) => {
            const links = [
              book.sourceUrl ? `<a href="${escapeHtml(book.sourceUrl)}" target="_blank" rel="noreferrer">Источник</a>` : "",
              book.livelibUrl ? `<a href="${escapeHtml(book.livelibUrl)}" target="_blank" rel="noreferrer">LiveLib</a>` : "",
              book.wildberriesUrl ? `<a href="${escapeHtml(book.wildberriesUrl)}" target="_blank" rel="noreferrer">Wildberries</a>` : "",
            ]
              .filter(Boolean)
              .join("");

            return `
              <article class="book">
                <div class="cover">
                  ${
                    book.cover
                      ? `<img src="${escapeHtml(book.cover)}" alt="Обложка: ${escapeHtml(book.title)}" loading="lazy" />`
                      : `<div class="cover-placeholder">${escapeHtml(book.title || "Книга")}</div>`
                  }
                  <span class="badge ${escapeHtml(book.section)}">${escapeHtml(labels[book.section] || "Книга")}</span>
                </div>
                <div class="body">
                  <h2 class="title">${escapeHtml(book.title || "Без названия")}</h2>
                  <p class="author">${escapeHtml(book.author || "Автор не указан")}</p>
                  <div class="meta">
                    ${book.year ? `<span class="pill">${escapeHtml(book.year)}</span>` : ""}
                    ${book.publisher ? `<span class="pill">${escapeHtml(book.publisher)}</span>` : ""}
                    ${book.isbn ? `<span class="pill">ISBN ${escapeHtml(book.isbn)}</span>` : ""}
                    <span class="pill">${escapeHtml(getStatusLabel(book.status))}</span>
                  </div>
                  ${book.annotation ? `<p class="annotation">${escapeHtml(book.annotation)}</p>` : ""}
                  ${links ? `<div class="links">${links}</div>` : ""}
                </div>
              </article>
            `;
          })
          .join("");

        empty.style.display = visible.length ? "none" : "block";
      }

      document.querySelector("#search").addEventListener("input", (event) => {
        state.search = event.target.value;
        render();
      });

      document.querySelector("#sectionFilter").addEventListener("change", (event) => {
        state.section = event.target.value;
        render();
      });

      statusFilter.addEventListener("change", (event) => {
        state.status = event.target.value;
        render();
      });

      renderStatusOptions();
      render();
    </script>
  </body>
</html>
