<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Книга | VLC Biblio</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ee;
        --ink: #26231f;
        --muted: #716b63;
        --line: #ddd4c5;
        --paper: #fffdf8;
        --green: #2f6f5e;
        --blue: #315f86;
        --gold: #b27728;
        --shadow: 0 14px 36px rgba(38, 35, 31, 0.1);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button { font: inherit; }

      .page {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 44px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        margin-bottom: 18px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.2;
        padding: 0 12px;
        text-decoration: none;
      }

      .book {
        display: grid;
        grid-template-columns: minmax(220px, 340px) minmax(0, 1fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      .cover {
        min-height: 100%;
        background: #e9e2d4;
      }

      .cover.is-broken {
        background: #eee7d8;
      }

      .cover img,
      .cover-placeholder {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 420px;
        object-fit: cover;
      }

      .cover-placeholder {
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--muted);
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        line-height: 1.1;
      }

      .body {
        padding: 28px;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .badge {
        display: inline-flex;
        border-radius: 999px;
        background: rgba(247, 244, 238, 0.94);
        color: var(--ink);
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.library { color: var(--green); }
      .badge.exchange { color: var(--blue); }

      h1 {
        margin: 14px 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 6vw, 52px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .author {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 18px;
      }

      .details {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 8px 16px;
        margin: 22px 0;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .details dt {
        color: var(--muted);
        font-size: 13px;
      }

      .details dd {
        margin: 0;
        font-size: 14px;
      }

      .annotation {
        margin: 0;
        color: #4d473f;
        font-size: 15px;
        line-height: 1.55;
      }

      .collection-note {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }

      .actions a,
      .actions button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--blue);
        min-height: 40px;
        padding: 8px 12px;
        text-decoration: none;
        cursor: pointer;
        font-weight: 700;
        line-height: 1.22;
      }

      .actions a:hover,
      .actions button:hover {
        border-color: var(--blue);
      }

      .telegram-icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        fill: currentColor;
      }

      .actions .telegram-action span {
        display: block;
        min-width: 0;
        text-align: center;
      }

      .actions .telegram-action {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
      }

      .related {
        margin-top: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.7);
        padding: 18px;
      }

      .related-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }

      .related h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .related-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .related-tab {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
        padding: 0 12px;
      }

      .related-tab[aria-selected="true"] {
        border-color: var(--green);
        background: rgba(47, 111, 94, 0.11);
        color: var(--green);
      }

      .related-tab:disabled {
        cursor: default;
        opacity: 0.45;
      }

      .related-track {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        padding: 2px 2px 12px;
        scroll-snap-type: x proximity;
      }

      .related-card {
        display: flex;
        flex: 0 0 190px;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: inherit;
        text-decoration: none;
        scroll-snap-align: start;
      }

      .related-card:hover {
        border-color: rgba(49, 95, 134, 0.55);
      }

      .related-card:focus-visible {
        outline: 3px solid rgba(47, 111, 94, 0.35);
        outline-offset: 3px;
      }

      .related-cover {
        aspect-ratio: 4 / 5.7;
        background: #e9e2d4;
      }

      .related-cover.is-broken {
        background: #eee7d8;
      }

      .related-cover img,
      .related-cover .cover-placeholder {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: cover;
      }

      .related-cover .cover-placeholder {
        display: grid;
        place-items: center;
        padding: 14px;
        color: var(--muted);
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 18px;
        line-height: 1.1;
      }

      .related-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        padding: 12px;
      }

      .related-title {
        margin: 0 0 6px;
        font-size: 15px;
        line-height: 1.2;
      }

      .related-author {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.25;
      }

      .related-meta {
        margin: auto 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
      }

      .site-footer {
        display: flex;
        justify-content: flex-end;
        margin-top: 34px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }

      .privacy-link {
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      .privacy-link:hover { text-decoration: underline; }

      .empty {
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.58);
        color: var(--muted);
        padding: 40px;
        text-align: center;
      }

      @media (max-width: 820px) {
        .book { grid-template-columns: 1fr; }
        .cover img,
        .cover-placeholder {
          min-height: 320px;
          max-height: 460px;
        }
      }

      @media (max-width: 560px) {
        .page {
          width: min(100% - 20px, 980px);
          padding-top: 18px;
        }

        .body { padding: 20px; }
        .details { grid-template-columns: 1fr; gap: 4px; }
        .related { padding: 14px; }
        .related-header { align-items: flex-start; flex-direction: column; }
        .related h2 { font-size: 24px; }
        .related-card { flex-basis: 150px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="back" href="./">← Назад к каталогу</a>
      <section id="content"></section>
      <footer class="site-footer">
        <a class="privacy-link" href="./privacy.html">Конфиденциальность</a>
      </footer>
    </main>

    <script src="./data/books.js?v=20260911130754"></script>
    <script>
      const books = Array.isArray(window.BIBLIO_BOOKS) ? window.BIBLIO_BOOKS : [];
      const botUrl = "https://t.me/VLS_Biblio_bot";
      const libraryMapUrl = "https://www.google.com/maps/search/?api=1&query=Biblioteca%20P%C3%BAblica%20de%20Val%C3%A8ncia%20Pilar%20Faus%2039.470374%2C-0.381743";
      const labels = {
        library: "Библиотека Pilar Faus",
        exchange: "Частная библиотека",
      };
      const content = document.querySelector("#content");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function compact(value) {
        return String(value ?? "").trim();
      }

      function normalizeText(value) {
        return compact(value).toLocaleLowerCase("ru").replaceAll("ё", "е").replace(/\s+/g, " ");
      }

      function bookIdentity(book) {
        return String(book.id || book.requestId || book.isbn || `${book.title}|${book.author}`);
      }

      function fallbackCover(title) {
        return `<div class="cover-placeholder">${escapeHtml(title || "Книга")}</div>`;
      }

      function coverMarkup(book) {
        if (!book.cover) return fallbackCover(book.title);
        return `<img src="${escapeHtml(book.cover)}" alt="Обложка: ${escapeHtml(book.title)}" decoding="async" referrerpolicy="no-referrer" data-fallback-title="${escapeHtml(book.title || "Книга")}" />`;
      }

      function telegramIcon() {
        return `<svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 4.3 18.4 20c-.2 1-.8 1.2-1.6.8l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.3L6 13.5l-4.8-1.5c-1-.3-1-1 .2-1.5L20.2 3.2c.9-.3 1.7.2 1.5 1.1Z"/></svg>`;
      }

      function actionLabelMarkup(action) {
        if (action.isTelegram) {
          return `<span>Запросить книгу</span><span>через Телеграм</span>`;
        }
        return `<span>${escapeHtml(action.label)}</span>`;
      }

      function requestUrl(book) {
        const key = encodeURIComponent(`book_${book.requestId || book.id || book.isbn || ""}`.replaceAll("-", ""));
        return `${botUrl}?start=${key}`;
      }

      function correctionUrl(book) {
        const key = encodeURIComponent(`fix_${book.requestId || book.id || book.isbn || ""}`.replaceAll("-", ""));
        return `${botUrl}?start=${key}`;
      }

      function canRequestBook(book) {
        return book.section === "exchange" && book.availability === "available";
      }

      function libraryAction(book) {
        if (canRequestBook(book)) {
          return {
            href: requestUrl(book),
            label: "Запросить книгу через Телеграм",
            isTelegram: true,
          };
        }
        if (book.section === "library") {
          return {
            href: libraryMapUrl,
            label: "Библиотека Pilar Faus",
          };
        }
        return null;
      }

      function googleSearchUrl(book) {
        const query = [book.title, book.isbn].map(compact).filter(Boolean).join(" ");
        return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      }

      function collectionNote(book) {
        if (book.section === "exchange") {
          return "Книга в частной коллекции. Вы можете запросить книгу на время.";
        }
        return "Книга в библиотеке Pilar Faus.";
      }

      function detailsMarkup(book) {
        const details = [
          ["ISBN", book.isbn],
          ["Год выпуска", book.year],
          ["Издательство", book.publisher],
          ["Обновлено", book.updatedAt ? new Date(book.updatedAt).toLocaleDateString("ru") : ""],
        ].filter((detail) => detail && detail[1]);

        return details
          .map(([label, value]) => `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`)
          .join("");
      }

      function badgesMarkup(book) {
        if (book.section === "exchange") return "";
        return `<div class="badges"><span class="badge ${escapeHtml(book.section)}">${escapeHtml(book.catalogStatus || labels[book.section] || "Книга")}</span></div>`;
      }

      function relatedUrl(book) {
        return `./book.html?id=${encodeURIComponent(book.id || book.requestId || "")}`;
      }

      function relatedCardMarkup(book) {
        return `
          <a class="related-card" href="${escapeHtml(relatedUrl(book))}">
            <div class="related-cover">${coverMarkup(book)}</div>
            <div class="related-body">
              <h3 class="related-title">${escapeHtml(book.title || "Без названия")}</h3>
              <p class="related-author">${escapeHtml(book.author || "Автор не указан")}</p>
              <p class="related-meta">${escapeHtml([book.publisher, book.year].filter(Boolean).join(" · "))}</p>
            </div>
          </a>
        `;
      }

      function relatedCollections(book) {
        const currentId = bookIdentity(book);
        const currentAuthor = normalizeText(book.author);
        const currentLibrary = normalizeText(book.catalogStatus || labels[book.section]);
        const sameAuthor = currentAuthor
          ? books.filter((item) => bookIdentity(item) !== currentId && normalizeText(item.author) === currentAuthor)
          : [];
        const sameAuthorIds = new Set(sameAuthor.map(bookIdentity));
        const sameLibrary = book.section === "library" && currentLibrary
          ? books.filter(
              (item) =>
                bookIdentity(item) !== currentId &&
                item.section === "library" &&
                normalizeText(item.catalogStatus || labels[item.section]) === currentLibrary &&
                !sameAuthorIds.has(bookIdentity(item))
            )
          : [];
        return { author: sameAuthor, library: sameLibrary };
      }

      function relatedListMarkup(items) {
        return `<div class="related-track">${items.map(relatedCardMarkup).join("")}</div>`;
      }

      function relatedSectionMarkup(book) {
        const collections = relatedCollections(book);
        if (!collections.author.length && !collections.library.length) return "";
        const active = collections.author.length ? "author" : "library";
        const activeItems = collections[active];
        return `
          <section class="related" data-book-id="${escapeHtml(book.id)}" data-related-active="${active}" aria-label="Похожие книги">
            <div class="related-header">
              <h2>Похожие книги</h2>
              <div class="related-tabs" role="tablist" aria-label="Фильтр похожих книг">
                <button class="related-tab" type="button" role="tab" data-related-tab="author" aria-selected="${active === "author"}" ${collections.author.length ? "" : "disabled"}>Того же автора</button>
                <button class="related-tab" type="button" role="tab" data-related-tab="library" aria-selected="${active === "library"}" ${collections.library.length ? "" : "disabled"}>В этой же библиотеке</button>
              </div>
            </div>
            <div class="related-results" aria-live="polite">${relatedListMarkup(activeItems)}</div>
          </section>
        `;
      }

      function setRelatedTab(section, kind) {
        const book = books.find((item) => String(item.id) === String(section.dataset.bookId));
        if (!book) return;
        const collections = relatedCollections(book);
        if (!collections[kind]?.length) return;
        section.dataset.relatedActive = kind;
        section.querySelectorAll(".related-tab").forEach((tab) => {
          tab.setAttribute("aria-selected", String(tab.dataset.relatedTab === kind));
        });
        section.querySelector(".related-results").innerHTML = relatedListMarkup(collections[kind]);
      }

      function renderBook(book) {
        document.title = `${book.title || "Книга"} | VLC Biblio`;
        content.innerHTML = `
          <article class="book">
            <div class="cover">${coverMarkup(book)}</div>
            <div class="body">
              ${badgesMarkup(book)}
              <h1>${escapeHtml(book.title || "Без названия")}</h1>
              <p class="author">${escapeHtml(book.author || "Автор не указан")}</p>
              <dl class="details">${detailsMarkup(book)}</dl>
              <p class="annotation">${escapeHtml(book.annotation || "Описание пока не добавлено.")}</p>
              <p class="collection-note">${escapeHtml(collectionNote(book))}</p>
              <div class="actions">
                ${libraryAction(book) ? `<a class="${libraryAction(book).isTelegram ? "telegram-action" : ""}" href="${escapeHtml(libraryAction(book).href)}" target="_blank" rel="noreferrer">${actionLabelMarkup(libraryAction(book))}</a>` : ""}
                <a href="${escapeHtml(correctionUrl(book))}" target="_blank" rel="noreferrer">Хочу сообщить об ошибке</a>
                <a href="${escapeHtml(googleSearchUrl(book))}" target="_blank" rel="noreferrer">Google</a>
              </div>
            </div>
          </article>
          ${relatedSectionMarkup(book)}
        `;
      }

      function renderMissing() {
        document.title = "Книга не найдена | VLC Biblio";
        content.innerHTML = `<p class="empty">Книга не найдена. Вернитесь в каталог и выберите другую карточку.</p>`;
      }

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id") || params.get("book");
      const book = books.find(
        (item) => String(item.id) === String(id) || String(item.requestId) === String(id)
      );
      if (book) renderBook(book);
      else renderMissing();

      content.addEventListener("click", (event) => {
        const tab = event.target.closest(".related-tab");
        if (!tab) return;
        const section = tab.closest(".related");
        if (!section) return;
        setRelatedTab(section, tab.dataset.relatedTab);
      });

      content.addEventListener("error", (event) => {
        if (event.target.tagName !== "IMG") return;
        const cover = event.target.closest(".cover, .related-cover");
        if (cover) cover.classList.add("is-broken");
        event.target.replaceWith(document.createRange().createContextualFragment(fallbackCover(event.target.dataset.fallbackTitle)));
      }, true);

    </script>
  </body>
</html>
